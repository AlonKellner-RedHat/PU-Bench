dataset_class: 20News
data_dir: ./datasets
random_seeds: [42, 456, 789, 1024, 2048, 100, 200, 300, 400, 500]
c_values: [0.01, 0.5, 0.99]  # Reduced from Phase 3's 7 values
target_prevalence_train_values: [0.01, 0.1, 0.3, 0.5, 0.7, 0.9, 0.99]  # Same as Phase 3

# Phase 4: Fine-grained method_prior grid for robustness analysis
method_prior_values: [
  null,     # For methods without prior support (if any remain)
  "auto",   # Compute from labeled data (c × π)
  "true",   # Use true prior π directly
  0.01,     # Near-zero prior (edge case)
  0.1111,   # 1/9
  0.2222,   # 2/9
  0.3333,   # 1/3
  0.4444,   # 4/9
  0.5,      # 1/2
  0.5556,   # 5/9
  0.6667,   # 2/3 (hypothesis: optimal robust prior)
  0.7778,   # 7/9
  0.8889,   # 8/9
  0.99,     # Near-unity prior (edge case, expect poor performance)
  "ep_linear" # (effective_prior + 1) / 3
]

# Text dataset specific
sbert_model_name: all-MiniLM-L6-v2
sbert_embeddings_path: ./scripts/embeddings/20news_sbert_embeddings.npz

# PU setup
scenarios: [case-control]
selection_strategies: [random]
val_ratio: 0.01
target_prevalence: [null]  # Don't resample test set
with_replacement: true
case_control_mode: "naive_mode"
also_print_dataset_stats: false
